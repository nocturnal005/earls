<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — Earl's Frames London</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" integrity="sha384-GYcZF/Xz4/6ZHVch5eVcYcyWmSCvO3+ffsxF+B9hfRyc3XCkSws7SO5ZSGqHlUNH" crossorigin="anonymous"></script>
    <style>
      :root {
        --earls-red: #C41E1E; --earls-red-hover: #A31818; --earls-black: #1A1A1A;
        --acc-bg: #FAF7F2; --acc-panel: #FFFFFF; --acc-border: #E5DFD6; --acc-muted: #8A7E74;
      }
      body { background: var(--acc-bg); }
      .acc-wrap { max-width: 960px; margin: 0 auto; padding: 100px 20px 60px; }
      .acc-h1 { font-family: 'Libre Baskerville', serif; color: var(--earls-black); font-size: 1.8rem; margin: 0 0 4px; }
      .acc-sub { color: var(--acc-muted); margin: 0 0 28px; font-size: 0.95rem; }

      /* Auth card */
      .auth-card { max-width: 420px; margin: 0 auto; background: var(--acc-panel); border: 1px solid var(--acc-border);
        border-radius: 12px; padding: 28px; box-shadow: 0 2px 16px rgba(44,36,32,.06); }
      .auth-tabs { display: flex; gap: 4px; background: #F0EBE3; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
      .auth-tab { flex: 1; padding: 9px; border: none; background: transparent; border-radius: 6px; cursor: pointer;
        font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 0.9rem; color: var(--acc-muted); }
      .auth-tab.active { background: #fff; color: var(--earls-black); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--earls-black); margin-bottom: 5px; }
      .field input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--acc-border);
        border-radius: 8px; font-size: 0.95rem; font-family: 'Source Sans 3', sans-serif; background: #fff; }
      .field input:focus { outline: none; border-color: var(--earls-red); }
      .row2 { display: flex; gap: 12px; }
      .row2 .field { flex: 1; }
      .btn-primary { width: 100%; padding: 12px; background: var(--earls-red); color: #fff; border: none; border-radius: 8px;
        font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: 'Source Sans 3', sans-serif; }
      .btn-primary:hover { background: var(--earls-red-hover); }
      .btn-primary:disabled { opacity: .6; cursor: default; }
      .link-btn { background: none; border: none; color: var(--earls-red); cursor: pointer; font-size: 0.85rem;
        padding: 0; font-family: 'Source Sans 3', sans-serif; text-decoration: underline; }
      .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: var(--acc-muted); font-size: 0.8rem; }
      .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--acc-border); }
      .social { display: flex; flex-direction: column; gap: 10px; }
      .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; border-radius: 8px;
        border: 1px solid var(--acc-border); background: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem;
        font-family: 'Source Sans 3', sans-serif; color: var(--earls-black); }
      .btn-social:hover { background: #FAF7F2; }
      .btn-social.apple { background: #000; color: #fff; border-color: #000; }
      .btn-social.apple:hover { background: #1a1a1a; }
      .msg { padding: 11px 13px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 14px; display: none; }
      .msg.error { background: #FCE7E7; color: #B91C1C; display: block; }
      .msg.ok { background: #E7F6EC; color: #1E7D34; display: block; }

      /* Dashboard */
      .dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
      @media (max-width: 760px) { .dash-grid { grid-template-columns: 1fr; } }
      .card { background: var(--acc-panel); border: 1px solid var(--acc-border); border-radius: 12px; padding: 22px;
        box-shadow: 0 2px 12px rgba(44,36,32,.05); }
      .card h2 { font-family: 'Libre Baskerville', serif; font-size: 1.15rem; margin: 0 0 16px; color: var(--earls-black); }
      .order { border: 1px solid var(--acc-border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
      .order__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .order__date { font-size: 0.8rem; color: var(--acc-muted); }
      .order__total { font-weight: 700; color: var(--earls-black); }
      .order__items { font-size: 0.88rem; color: #5a5048; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
      .badge.received { background: #E8EEFC; color: #2952CC; }
      .badge.production { background: #FCF3E0; color: #B7791F; }
      .badge.ready { background: #E7F6EC; color: #1E7D34; }
      .badge.shipped { background: #EFE8FC; color: #6B46C1; }
      .badge.refunded { background: #FCE7E7; color: #B91C1C; }
      .empty { color: var(--acc-muted); font-size: 0.9rem; padding: 8px 0; }
      .logout { float: right; }
      .muted-note { font-size: 0.78rem; color: var(--acc-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">
                <img src="assets/images/earls_logo.png" alt="Earl's Frames London Logo">
                <span class="logo-text">Earl's Frames London</span>
            </a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Home</a></li>
                    <li><a href="frame-my-photo.html" class="nav__link">Frame My Photo</a></li>
                </ul>
            </nav>
            <div class="header__contact">
                <span class="iconify header__contact-icon" data-icon="lucide:phone"></span>
                <span>075 0896 3540</span>
                <a href="account.html" class="header__account" id="header-account-btn" aria-label="Account" style="margin-left: 20px; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.9rem;" title="My Account">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="header__account-label">Log in</span>
                </a>
            </div>
        </div>
    </header>

    <main class="acc-wrap">
      <!-- LOGGED-OUT: auth card -->
      <section id="auth-view" style="display:none;">
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" data-mode="login" id="tab-login">Log in</button>
            <button class="auth-tab" data-mode="signup" id="tab-signup">Sign up</button>
          </div>

          <div class="msg" id="auth-msg"></div>

          <form id="auth-form">
            <div class="row2" id="name-fields" style="display:none;">
              <div class="field"><label>First name</label><input type="text" id="f-first" autocomplete="given-name"></div>
              <div class="field"><label>Last name</label><input type="text" id="f-last" autocomplete="family-name"></div>
            </div>
            <div class="field"><label>Email</label><input type="email" id="f-email" autocomplete="email" required></div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="f-password" autocomplete="current-password" required>
              <p id="pw-hint" style="display:none; font-size:0.78rem; color:var(--acc-muted); margin:5px 0 0;">Must be at least 8 characters.</p>
            </div>
            <div style="text-align:right; margin:-4px 0 14px;">
              <button type="button" class="link-btn" id="forgot-btn" style="display:none;">Forgot password?</button>
            </div>
            <button type="submit" class="btn-primary" id="auth-submit">Log in</button>
          </form>

          <div class="divider">or continue with</div>
          <div class="social">
            <button class="btn-social" data-provider="google">
              <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.6 34.6 26.9 36 24 36c-5.2 0-9.6-3.3-11.2-8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.6 5.6C42.8 35.4 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
              Continue with Google
            </button>
            <!-- Apple and Microsoft buttons hidden until their providers are configured in Supabase.
                 Restore by un-commenting (and enabling the provider) when ready (Phase 2).
            <button class="btn-social apple" data-provider="apple">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.04c-.03-2.6 2.13-3.85 2.23-3.91-1.22-1.78-3.11-2.02-3.78-2.05-1.61-.16-3.14.95-3.96.95-.81 0-2.07-.93-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.82 3.16-.47 7.83 1.3 10.4.86 1.25 1.89 2.66 3.24 2.61 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.39.81 1.4-.02 2.28-1.28 3.13-2.54.99-1.45 1.4-2.86 1.42-2.93-.03-.01-2.72-1.04-2.43-4.21M14.53 4.4c.72-.87 1.2-2.08 1.07-3.28-1.03.04-2.28.69-3.02 1.55-.66.77-1.24 2-1.09 3.18 1.15.09 2.32-.58 3.04-1.45"/></svg>
              Continue with Apple
            </button>
            <button class="btn-social" data-provider="azure">
              <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M12 1h10v10H12z"/><path fill="#00a4ef" d="M1 12h10v10H1z"/><path fill="#ffb900" d="M12 12h10v10H12z"/></svg>
              Continue with Microsoft
            </button>
            -->
          </div>
        </div>
      </section>

      <!-- LOGGED-IN: dashboard -->
      <section id="dash-view" style="display:none;">
        <button class="link-btn logout" id="logout-btn">Log out</button>
        <h1 class="acc-h1" id="greeting">My Account</h1>
        <p class="acc-sub" id="acc-email"></p>

        <div class="dash-grid">
          <div class="card">
            <h2>Order history</h2>
            <div id="orders-list"><p class="empty">Loading your orders…</p></div>
          </div>

          <div class="card">
            <h2>Saved details</h2>
            <div class="msg" id="profile-msg"></div>
            <form id="profile-form">
              <div class="row2">
                <div class="field"><label>First name</label><input type="text" id="p-first" autocomplete="given-name"></div>
                <div class="field"><label>Last name</label><input type="text" id="p-last" autocomplete="family-name"></div>
              </div>
              <div class="field"><label>Phone</label><input type="tel" id="p-phone" autocomplete="tel"></div>
              <div class="field"><label>Address</label><input type="text" id="p-address" autocomplete="address-line1"></div>
              <div class="row2">
                <div class="field"><label>Apt / unit</label><input type="text" id="p-apt" autocomplete="address-line2"></div>
                <div class="field"><label>City</label><input type="text" id="p-city" autocomplete="address-level2"></div>
              </div>
              <div class="field"><label>Postcode</label><input type="text" id="p-postcode" autocomplete="postal-code"></div>
              <button type="submit" class="btn-primary" id="profile-save">Save details</button>
              <p class="muted-note">Used to pre-fill checkout next time.</p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
    <script>
      const SUPABASE_URL = 'https://nytevdjawjoxqfkafwxg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dGV2ZGphd2pveHFma2Fmd3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDc3OTQsImV4cCI6MjA5NjQ4Mzc5NH0.wHh0rIioMpwtHWGnYeZn51IMCs5cK1Rohd7QXuc2DNY';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const $ = (id) => document.getElementById(id);
      let mode = 'login';

      function showMsg(el, text, type) { el.textContent = text; el.className = 'msg ' + type; }
      function clearMsg(el) { el.textContent = ''; el.className = 'msg'; }

      // ---- Tab switching ----
      function setMode(m) {
        mode = m;
        $('tab-login').classList.toggle('active', m === 'login');
        $('tab-signup').classList.toggle('active', m === 'signup');
        $('name-fields').style.display = m === 'signup' ? 'flex' : 'none';
        $('forgot-btn').style.display = m === 'login' ? 'inline' : 'none';
        $('auth-submit').textContent = m === 'login' ? 'Log in' : 'Create account';
        $('f-password').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
        if (m === 'signup') {
          $('f-password').setAttribute('minlength', '8');
          $('pw-hint').style.display = 'block';
        } else {
          $('f-password').removeAttribute('minlength');
          $('pw-hint').style.display = 'none';
        }
        clearMsg($('auth-msg'));
      }
      $('tab-login').onclick = () => setMode('login');
      $('tab-signup').onclick = () => setMode('signup');

      // ---- Email / password submit ----
      $('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        clearMsg($('auth-msg'));
        const email = $('f-email').value.trim();
        const password = $('f-password').value;
        const btn = $('auth-submit');
        btn.disabled = true;
        try {
          if (mode === 'signup') {
            const { data, error } = await sb.auth.signUp({
              email, password,
              options: { data: { first_name: $('f-first').value.trim(), last_name: $('f-last').value.trim() } },
            });
            if (error) throw error;
            if (data.session) { await render(); }
            else { showMsg($('auth-msg'), 'Account created. Please check your email to confirm, then log in.', 'ok'); setMode('login'); }
          } else {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            await render();
          }
        } catch (err) {
          showMsg($('auth-msg'), err.message || 'Something went wrong. Please try again.', 'error');
        } finally {
          btn.disabled = false;
        }
      };

      // ---- Forgot password ----
      $('forgot-btn').onclick = async () => {
        const email = $('f-email').value.trim();
        if (!email) { showMsg($('auth-msg'), 'Enter your email above first, then tap “Forgot password?”.', 'error'); return; }
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/account.html' });
        if (error) showMsg($('auth-msg'), error.message, 'error');
        else showMsg($('auth-msg'), 'Password reset link sent — check your email.', 'ok');
      };

      // ---- Social login ----
      const PROVIDER_NAME = { google: 'Google', apple: 'Apple', azure: 'Microsoft' };
      document.querySelectorAll('.btn-social').forEach((b) => {
        b.onclick = async () => {
          const provider = b.dataset.provider;
          const options = { redirectTo: window.location.origin + '/account.html' };
          // Azure (Microsoft) needs an explicit email scope to return the address.
          if (provider === 'azure') options.scopes = 'email';
          const { error } = await sb.auth.signInWithOAuth({ provider, options });
          if (error) {
            const nice = /not enabled|provider/i.test(error.message)
              ? (PROVIDER_NAME[provider] || provider) + ' sign-in isn’t switched on yet. Try email, or another option.'
              : error.message;
            showMsg($('auth-msg'), nice, 'error');
          }
        };
      });

      // ---- Logout ----
      $('logout-btn').onclick = async () => { await sb.auth.signOut(); await render(); };

      // ---- Inactivity timeout (30 minutes) ----
      const INACTIVITY_LIMIT = 30 * 60 * 1000;
      let inactivityTimer = null;
      function resetInactivityTimer() {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(async () => {
          const { data: { session } } = await sb.auth.getSession();
          if (!session) return;
          await sb.auth.signOut();
          await render();
        }, INACTIVITY_LIMIT);
      }
      ['mousemove', 'click', 'keydown', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, resetInactivityTimer, { passive: true });
      });

      // ---- Save profile ----
      $('profile-form').onsubmit = async (e) => {
        e.preventDefault();
        clearMsg($('profile-msg'));
        $('profile-save').disabled = true;
        const { error } = await sb.auth.updateUser({ data: {
          first_name: $('p-first').value.trim(), last_name: $('p-last').value.trim(),
          phone: $('p-phone').value.trim(), address: $('p-address').value.trim(),
          apt: $('p-apt').value.trim(), city: $('p-city').value.trim(), postcode: $('p-postcode').value.trim(),
        }});
        $('profile-save').disabled = false;
        if (error) showMsg($('profile-msg'), error.message, 'error');
        else showMsg($('profile-msg'), 'Saved.', 'ok');
      };

      // ---- Order history ----
      const STATUS_MAP = {
        new: ['Received', 'received'], in_progress: ['In production', 'production'],
        completed: ['Ready', 'ready'], shipped: ['Shipped', 'shipped'], refunded: ['Refunded', 'refunded'],
      };
      function fmtDate(s) { try { return new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } }

      async function loadOrders(session) {
        const list = $('orders-list');
        try {
          const res = await fetch('/api/my-orders', { headers: { Authorization: 'Bearer ' + session.access_token } });
          if (!res.ok) throw new Error('fetch failed');
          const orders = await res.json();
          if (!orders.length) { list.innerHTML = '<p class="empty">No orders yet. When you place one, it’ll appear here.</p>'; return; }
          list.innerHTML = orders.map((o) => {
            const map = STATUS_MAP[o.status] || ['Processing', 'received'];
            const count = Array.isArray(o.items) ? o.items.reduce((n, i) => n + (i.qty || 1), 0) : 1;
            return `<div class="order">
              <div class="order__top">
                <span class="order__date">${fmtDate(o.created_at)}</span>
                <span class="badge ${map[1]}">${map[0]}</span>
              </div>
              <div class="order__top">
                <span class="order__items">${count} item${count === 1 ? '' : 's'}</span>
                <span class="order__total">£${Number(o.total).toFixed(2)}</span>
              </div>
            </div>`;
          }).join('');
        } catch (e) {
          list.innerHTML = '<p class="empty">Couldn’t load your orders right now. Please refresh.</p>';
        }
      }

      function fillProfile(user) {
        const m = user.user_metadata || {};
        $('p-first').value = m.first_name || ''; $('p-last').value = m.last_name || '';
        $('p-phone').value = m.phone || ''; $('p-address').value = m.address || '';
        $('p-apt').value = m.apt || ''; $('p-city').value = m.city || ''; $('p-postcode').value = m.postcode || '';
      }

      // ---- Render based on session ----
      async function render() {
        const { data: { session } } = await sb.auth.getSession();
        const label = document.querySelector('.header__account-label');
        if (session && session.user) {
          $('auth-view').style.display = 'none';
          $('dash-view').style.display = 'block';
          const name = session.user.user_metadata?.first_name;
          $('greeting').textContent = name ? `Hi, ${name}` : 'My Account';
          $('acc-email').textContent = session.user.email || '';
          if (label) label.textContent = name || 'Account';
          fillProfile(session.user);
          loadOrders(session);
        } else {
          $('dash-view').style.display = 'none';
          $('auth-view').style.display = 'block';
          if (label) label.textContent = 'Log in';
          setMode('login');
        }
      }

      render();
    </script>
</body>
</html>

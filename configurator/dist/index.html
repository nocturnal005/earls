<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Configurator | Earl's Frames London</title>
    <meta name="description" content="Upload your photo, choose your frame, mount and glass — design your custom framed print with our interactive configurator." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Dev-only header/footer styles (production loads css/styles.css via frame-my-photo.html) -->
    <style>
      :root {
        --earls-red: #C41E1E; --earls-black: #1A1A1A; --earls-white: #FAFAFA;
        --font-heading: 'Libre Baskerville', Georgia, serif;
        --font-body: 'Source Sans 3', -apple-system, sans-serif;
        --space-xs: 0.25rem; --space-sm: 0.5rem; --space-md: 1rem; --space-xl: 2rem;
        --max-width: 1400px; --container-padding: clamp(1.5rem, 5vw, 4rem);
        --transition-base: 300ms ease;
      }
      a { text-decoration: none; color: inherit; }
      ul { list-style: none; }
      .container { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--container-padding); }
      .header { position: fixed; top: 0; left: 0; width: 100%; background-color: rgba(26,26,26,0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 100; padding: var(--space-sm) 0; }
      .header__inner { display: flex; justify-content: space-between; align-items: center; }
      .logo { display: flex; align-items: center; gap: var(--space-sm); color: #fff; }
      .logo img { height: 50px; width: auto; }
      .logo-text { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .nav__list { display: flex; gap: var(--space-xl); margin: 0; padding: 0; }
      .nav__link { color: #fff; font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
      .header__contact { display: flex; align-items: center; gap: var(--space-sm); color: #fff; font-weight: 600; }
      .mobile-menu-btn { display: none; }
      .footer { background-color: var(--earls-black); color: #fff; padding: 3rem 0 1.5rem; margin-top: 0; }
      .footer-brand p { color: #aaa; margin-top: 0.75rem; font-size: 0.9rem; }
    </style>

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <script type="module" crossorigin src="/configurator/dist/assets/configurator.js"></script>
    <link rel="stylesheet" crossorigin href="/configurator/dist/assets/configurator.css">
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
        <div class="container header__inner">
            <a href="../index.html" class="logo">
                <img src="/configurator/dist/earls_logo.png" alt="Earl's Frames London Logo">
                <span class="logo-text">Earl's Frames London</span>
            </a>
            
            <nav class="nav">
                <button class="mobile-menu-btn" aria-label="Toggle menu">
                    <span class="iconify" data-icon="lucide:menu"></span>
                </button>
                <ul class="nav__list">
                    <li><a href="../index.html#services" class="nav__link">Services</a></li>
                    <li><a href="../frame-my-photo.html" class="nav__link">Frame My Photo</a></li>
                    <li><a href="../index.html#contact" class="nav__link">Contact</a></li>
                    <li><a href="../index.html#gallery" class="nav__link">Gallery</a></li>
                </ul>
            </nav>
            
            <div class="header__contact">
                <span class="iconify header__contact-icon" data-icon="lucide:phone"></span>
                <span>075 0896 3540</span>
                <a href="#" class="header__cart" id="header-cart-btn" aria-label="Shopping Cart" style="margin-left: 20px; color: #fff; text-decoration: none; display: flex; align-items: center; position: relative;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
                    <span class="header__cart-count" id="header-cart-count" style="display:none; position: absolute; top: -6px; right: -8px; background: #C41E1E; color: white; font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center;">0</span>
                </a>
            </div>
        </div>
    </header>

    <main style="padding-top: 66px; min-height: 100vh; background: linear-gradient(to right, #E5E2DD 60%, #FFFFFF 60%);">
        <div id="root"></div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand">
                    <a href="../index.html" class="logo">
                        <img src="/configurator/dist/earls_logo.png" alt="Earl's Frames London Logo">
                        <span class="logo-text">Earl's Frames London</span>
                    </a>
                    <p>Professional, bespoke picture framing services in Peckham, London. Elevating your art with quality craftsmanship.</p>
                </div>
            </div>
        </div>
    </footer>
</html>

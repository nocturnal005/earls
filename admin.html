<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Management | Earl's Frames London</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Source Sans 3', system-ui, sans-serif;
        background: #F5F3F0;
        color: #2A2725;
        min-height: 100vh;
      }

      /* ── Login Screen ── */
      .login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: linear-gradient(135deg, #1A1A1A 0%, #2A2725 100%);
      }
      .login-card {
        background: #fff;
        border-radius: 14px;
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      }
      .login-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .login-logo img { height: 40px; }
      .login-logo span {
        font-family: 'Libre Baskerville', Georgia, serif;
        font-size: 20px;
        font-weight: 700;
      }
      .login-subtitle {
        text-align: center;
        font-size: 13px;
        color: #8A8580;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 32px;
      }
      .login-field {
        margin-bottom: 16px;
      }
      .login-field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #6B6560;
        margin-bottom: 6px;
      }
      .login-field input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #D5D0CB;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        transition: border-color 0.15s;
      }
      .login-field input:focus {
        outline: none;
        border-color: #3D6B35;
        box-shadow: 0 0 0 3px rgba(61,107,53,0.1);
      }
      .login-btn {
        width: 100%;
        padding: 14px;
        background: #1A1A1A;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s;
        margin-top: 8px;
      }
      .login-btn:hover { background: #333; }
      .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .login-error {
        background: #FEE2E2;
        color: #991B1B;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        display: none;
      }
      .login-error.show { display: block; }
      .login-success {
        background: #D1FAE5;
        color: #065F46;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        display: none;
      }
      .login-success.show { display: block; }
      .login-forgot {
        text-align: center;
        margin-top: 16px;
      }
      .login-forgot a {
        color: #8A8580;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.15s;
      }
      .login-forgot a:hover { color: #3D6B35; }
      .login-back {
        text-align: center;
        margin-top: 16px;
      }
      .login-back a {
        color: #3D6B35;
        font-size: 14px;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
      }

      /* ── Reset Password Screen ── */
      .reset-screen { display: none; }
      .reset-screen.show { display: flex; }
      .login-screen.hide { display: none; }

      /* ── Admin Dashboard (hidden until logged in) ── */
      .admin-wrap { display: none; }
      .admin-wrap.show { display: block; }

      /* Header */
      .admin-header {
        background: #1A1A1A;
        color: #fff;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .admin-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .admin-header-left img {
        height: 36px;
        width: auto;
      }
      .admin-header-left span {
        font-family: 'Libre Baskerville', Georgia, serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .admin-header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .admin-header-tag {
        background: #3D6B35;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .admin-user {
        font-size: 13px;
        color: #AAA;
      }
      .logout-btn {
        padding: 6px 14px;
        background: transparent;
        color: #AAA;
        border: 1px solid #555;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
      }
      .logout-btn:hover { color: #fff; border-color: #fff; }

      /* Layout */
      .admin-body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px;
      }

      /* Stats row */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 28px;
      }
      .stat-card {
        background: #fff;
        border-radius: 10px;
        padding: 20px;
        border: 1px solid #E8E4E0;
      }
      .stat-label {
        font-size: 14px;
        color: #8A8580;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .stat-value {
        font-size: 30px;
        font-weight: 700;
        color: #2A2725;
      }

      /* Filters */
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .filter-btn {
        padding: 8px 18px;
        border: 1px solid #D5D0CB;
        background: #fff;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        color: #6B6560;
        transition: all 0.15s;
        font-family: inherit;
      }
      .filter-btn:hover { border-color: #2A2725; color: #2A2725; }
      .filter-btn.active {
        background: #1A1A1A;
        color: #fff;
        border-color: #1A1A1A;
      }

      /* Orders table */
      .orders-table {
        width: 100%;
        background: #fff;
        border-radius: 10px;
        border: 1px solid #E8E4E0;
        overflow: hidden;
      }
      .orders-table table {
        width: 100%;
        border-collapse: collapse;
      }
      .orders-table th {
        text-align: left;
        padding: 14px 16px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #8A8580;
        background: #FAFAF8;
        border-bottom: 1px solid #E8E4E0;
      }
      .orders-table td {
        padding: 14px 16px;
        font-size: 15px;
        border-bottom: 1px solid #F0EDEA;
        vertical-align: top;
      }
      .orders-table tr:last-child td { border-bottom: none; }
      .orders-table tr:hover td { background: #FAFAF8; }

      /* Status badges */
      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        text-transform: capitalize;
      }
      .status-new { background: #DBEAFE; color: #1E40AF; }
      .status-in_progress { background: #FEF3C7; color: #92400E; }
      .status-completed { background: #D1FAE5; color: #065F46; }
      .status-shipped { background: #E0E7FF; color: #3730A3; }
      .status-archived { background: #F0EDEA; color: #8A8580; }

      .archive-btn {
        padding: 5px 12px;
        background: none;
        border: 1px solid #D5D0CB;
        border-radius: 5px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        color: #8A8580;
        transition: all 0.15s;
        margin-left: 6px;
      }
      .archive-btn:hover { border-color: #8A8580; color: #2A2725; }

      /* Status select */
      .status-select {
        padding: 6px 10px;
        border: 1px solid #D5D0CB;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        background: #fff;
      }

      /* Expand row */
      .expand-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: #8A8580;
        padding: 2px 6px;
        border-radius: 4px;
        transition: all 0.15s;
      }
      .expand-btn:hover { background: #F0EDEA; color: #2A2725; }

      .order-detail {
        display: none;
        background: #FAFAF8;
      }
      .order-detail.open { display: table-row; }
      .order-detail-inner {
        padding: 16px 16px 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .detail-section h4 {
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #8A8580;
        margin-bottom: 8px;
      }
      .detail-section p {
        font-size: 15px;
        line-height: 1.6;
        color: #2A2725;
      }
      .items-list {
        list-style: none;
        padding: 0;
      }
      .items-list li {
        padding: 6px 0;
        border-bottom: 1px solid #E8E4E0;
        font-size: 15px;
        display: flex;
        justify-content: space-between;
      }
      .items-list li:last-child { border-bottom: none; }

      /* Spec grid */
      .spec-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 8px;
      }
      .spec-item {
        background: #fff;
        border: 1px solid #E8E4E0;
        border-radius: 6px;
        padding: 8px 12px;
      }
      .spec-label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: #8A8580;
      }
      .spec-value {
        font-size: 15px;
        font-weight: 600;
        color: #2A2725;
        margin-top: 2px;
      }
      .spec-sub {
        font-size: 13px;
        color: #8A8580;
      }
      .item-divider {
        border: none;
        border-top: 1px solid #E8E4E0;
        margin: 14px 0;
      }

      /* Loading / empty */
      .loading, .empty {
        text-align: center;
        padding: 60px 24px;
        color: #8A8580;
        font-size: 16px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .orders-table { overflow-x: auto; }
        .order-detail-inner { grid-template-columns: 1fr; }
        .admin-body { padding: 20px 16px; }
        .login-card { padding: 36px 24px; }
        .admin-header { padding: 16px; }
        .admin-header-right { gap: 10px; }
        .admin-user { display: none; }
      }
    </style>
  </head>
  <body>

    <!-- ═══ LOGIN SCREEN ═══ -->
    <div class="login-screen" id="login-screen">
      <div class="login-card">
        <div class="login-logo">
          <img src="assets/images/earls_admin_logo.png" alt="Earl's">
          <span>Earl's Frames London</span>
        </div>
        <div class="login-subtitle">Admin Login</div>
        <div class="login-error" id="login-error"></div>
        <form id="login-form">
          <div class="login-field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="email" required />
          </div>
          <div class="login-field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="login-btn" id="login-btn">Sign In</button>
        </form>
        <div class="login-forgot">
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>
      </div>
    </div>

    <!-- ═══ FORGOT PASSWORD SCREEN ═══ -->
    <div class="login-screen reset-screen" id="reset-screen">
      <div class="login-card">
        <div class="login-logo">
          <img src="assets/images/earls_admin_logo.png" alt="Earl's">
          <span>Earl's Frames London</span>
        </div>
        <div class="login-subtitle">Reset Password</div>
        <div class="login-error" id="reset-error"></div>
        <div class="login-success" id="reset-success"></div>
        <form id="reset-form">
          <div class="login-field">
            <label for="reset-email">Email address</label>
            <input type="email" id="reset-email" autocomplete="email" required />
          </div>
          <button type="submit" class="login-btn" id="reset-btn">Send Reset Link</button>
        </form>
        <div class="login-back">
          <a id="back-to-login">Back to login</a>
        </div>
      </div>
    </div>

    <!-- ═══ UPDATE PASSWORD SCREEN (after clicking reset link) ═══ -->
    <div class="login-screen reset-screen" id="update-pw-screen">
      <div class="login-card">
        <div class="login-logo">
          <img src="assets/images/earls_admin_logo.png" alt="Earl's">
          <span>Earl's Frames London</span>
        </div>
        <div class="login-subtitle">Set New Password</div>
        <div class="login-error" id="update-pw-error"></div>
        <div class="login-success" id="update-pw-success"></div>
        <form id="update-pw-form">
          <div class="login-field">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" autocomplete="new-password" required minlength="8" />
          </div>
          <div class="login-field">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required minlength="8" />
          </div>
          <button type="submit" class="login-btn" id="update-pw-btn">Update Password</button>
        </form>
      </div>
    </div>

    <!-- ═══ ADMIN DASHBOARD ═══ -->
    <div class="admin-wrap" id="admin-wrap">
      <div class="admin-header">
        <div class="admin-header-left">
          <img src="assets/images/earls_admin_logo.png" alt="Earl's Frames London Logo">
          <span>Earl's Frames London</span>
          <div class="admin-header-tag">Admin</div>
        </div>
        <div class="admin-header-right">
          <span class="admin-user" id="admin-user"></span>
          <button class="logout-btn" id="logout-btn">Sign Out</button>
        </div>
      </div>

      <div class="admin-body">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">New Orders</div>
            <div class="stat-value" id="stat-new">–</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">In Progress</div>
            <div class="stat-value" id="stat-progress">–</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value" id="stat-completed">–</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Shipped</div>
            <div class="stat-value" id="stat-shipped">–</div>
          </div>
        </div>

        <div class="filters">
          <button class="filter-btn active" data-status="all">All Orders</button>
          <button class="filter-btn" data-status="new">New</button>
          <button class="filter-btn" data-status="in_progress">In Progress</button>
          <button class="filter-btn" data-status="completed">Completed</button>
          <button class="filter-btn" data-status="shipped">Shipped</button>
          <button class="filter-btn" data-status="archived">Archived</button>
        </div>

        <div class="orders-table">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Order Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Update</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="7" class="loading">Loading orders…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = 'https://nytevdjawjoxqfkafwxg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dGV2ZGphd2pveHFma2Fmd3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDc3OTQsImV4cCI6MjA5NjQ4Mzc5NH0.wHh0rIioMpwtHWGnYeZn51IMCs5cK1Rohd7QXuc2DNY';

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let accessToken = null;
      let allOrders = [];
      let currentFilter = 'all';

      // ── Auth state ──
      async function init() {
        // Check if arriving from a password reset link
        const hash = window.location.hash;
        if (hash && hash.includes('type=recovery')) {
          showScreen('update-pw');
          return;
        }

        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          onLogin(session);
        } else {
          showScreen('login');
        }

        sb.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            showScreen('update-pw');
          } else if (event === 'SIGNED_IN' && session) {
            onLogin(session);
          } else if (event === 'SIGNED_OUT') {
            showScreen('login');
          }
        });
      }

      function showScreen(screen) {
        document.getElementById('login-screen').classList.toggle('hide', screen !== 'login');
        document.getElementById('reset-screen').classList.toggle('show', screen === 'reset');
        document.getElementById('update-pw-screen').classList.toggle('show', screen === 'update-pw');
        document.getElementById('admin-wrap').classList.toggle('show', screen === 'admin');
      }

      function onLogin(session) {
        accessToken = session.access_token;
        document.getElementById('admin-user').textContent = session.user.email;
        showScreen('admin');
        resetInactivityTimer();
        fetchOrders();
      }

      // ── Login form ──
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const errEl = document.getElementById('login-error');
        errEl.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        } else if (data.session) {
          onLogin(data.session);
        }
      });

      // ── Forgot password ──
      document.getElementById('forgot-link').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('reset-email').value = document.getElementById('login-email').value;
        showScreen('reset');
      });

      document.getElementById('back-to-login').addEventListener('click', () => {
        showScreen('login');
      });

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reset-btn');
        const errEl = document.getElementById('reset-error');
        const successEl = document.getElementById('reset-success');
        errEl.classList.remove('show');
        successEl.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Sending…';

        const email = document.getElementById('reset-email').value.trim();
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/admin.html',
        });

        btn.disabled = false;
        btn.textContent = 'Send Reset Link';

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add('show');
        } else {
          successEl.textContent = 'Check your email for a password reset link.';
          successEl.classList.add('show');
        }
      });

      // ── Update password (after reset link) ──
      document.getElementById('update-pw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('update-pw-btn');
        const errEl = document.getElementById('update-pw-error');
        const successEl = document.getElementById('update-pw-success');
        errEl.classList.remove('show');
        successEl.classList.remove('show');

        const pw = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (pw !== confirm) {
          errEl.textContent = 'Passwords do not match.';
          errEl.classList.add('show');
          return;
        }
        if (pw.length < 8) {
          errEl.textContent = 'Password must be at least 8 characters.';
          errEl.classList.add('show');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating…';

        const { error } = await sb.auth.updateUser({ password: pw });

        btn.disabled = false;
        btn.textContent = 'Update Password';

        if (error) {
          errEl.textContent = error.message;
          errEl.classList.add('show');
        } else {
          successEl.textContent = 'Password updated. Redirecting to dashboard…';
          successEl.classList.add('show');
          setTimeout(() => {
            window.location.hash = '';
            window.location.reload();
          }, 1500);
        }
      });

      // ── Inactivity timeout (10 minutes) ──
      const INACTIVITY_LIMIT = 10 * 60 * 1000;
      let inactivityTimer = null;

      function resetInactivityTimer() {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        if (!accessToken) return;
        inactivityTimer = setTimeout(async () => {
          await sb.auth.signOut();
          accessToken = null;
          allOrders = [];
          showScreen('login');
          alert('You have been signed out due to inactivity.');
        }, INACTIVITY_LIMIT);
      }

      ['mousemove', 'click', 'keydown', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, resetInactivityTimer, { passive: true });
      });

      // ── Logout ──
      document.getElementById('logout-btn').addEventListener('click', async () => {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        await sb.auth.signOut();
        accessToken = null;
        allOrders = [];
        showScreen('login');
      });

      // ── Orders ──
      async function fetchOrders() {
        if (!accessToken) return;
        try {
          const res = await fetch('/api/orders', {
            headers: { 'Authorization': 'Bearer ' + accessToken },
          });
          if (res.status === 401) {
            await sb.auth.signOut();
            showScreen('login');
            return;
          }
          if (!res.ok) throw new Error('Failed to fetch');
          allOrders = await res.json();
          updateStats();
          renderOrders();
        } catch (err) {
          document.getElementById('orders-body').innerHTML =
            '<tr><td colspan="7" class="empty">Failed to load orders. Please refresh.</td></tr>';
        }
      }

      function updateStats() {
        const counts = { new: 0, in_progress: 0, completed: 0, shipped: 0 };
        allOrders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
        document.getElementById('stat-new').textContent = counts.new;
        document.getElementById('stat-progress').textContent = counts.in_progress;
        document.getElementById('stat-completed').textContent = counts.completed;
        document.getElementById('stat-shipped').textContent = counts.shipped;
      }

      function renderOrders() {
        const tbody = document.getElementById('orders-body');
        const hiddenFromAll = ['archived', 'pending_payment'];
        const filtered = currentFilter === 'all'
          ? allOrders.filter(o => !hiddenFromAll.includes(o.status))
          : allOrders.filter(o => o.status === currentFilter);

        if (filtered.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty">No orders found.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map(order => {
          const date = new Date(order.created_at).toLocaleDateString('en-GB', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          const name = [order.customer_first_name, order.customer_last_name].filter(Boolean).join(' ') || '—';
          const items = Array.isArray(order.items) ? order.items : [];
          const itemCount = items.reduce((sum, i) => sum + (i.qty || 1), 0);

          return `
            <tr>
              <td><button class="expand-btn" onclick="toggleDetail('${order.id}')">▶</button></td>
              <td>${date}</td>
              <td>
                <strong>${escapeHtml(name)}</strong><br>
                <span style="color:#8A8580;font-size:13px">${escapeHtml(order.customer_email || '')}</span>
              </td>
              <td>${itemCount} item${itemCount !== 1 ? 's' : ''}</td>
              <td><strong>&pound;${Number(order.total || 0).toFixed(2)}</strong></td>
              <td><span class="status-badge status-${order.status}">${order.status.replace('_', ' ')}</span></td>
              <td>
                <select class="status-select" onchange="updateStatus('${order.id}', this.value)">
                  <option value="new" ${order.status === 'new' ? 'selected' : ''}>New</option>
                  <option value="in_progress" ${order.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                  <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
                  <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                </select>
                ${order.status !== 'archived'
                  ? '<button class="archive-btn" onclick="archiveOrder(\'' + order.id + '\')">Archive</button>'
                  : '<button class="archive-btn" onclick="updateStatus(\'' + order.id + '\', \'shipped\')">Restore</button>'
                }
              </td>
            </tr>
            <tr class="order-detail" id="detail-${order.id}">
              <td colspan="7">
                <div class="order-detail-inner">
                  <div class="detail-section">
                    <h4>Shipping Address</h4>
                    <p>
                      ${escapeHtml(name)}<br>
                      ${escapeHtml(order.shipping_address || '')}${order.shipping_apt ? ', ' + escapeHtml(order.shipping_apt) : ''}<br>
                      ${escapeHtml(order.shipping_city || '')}${order.shipping_postcode ? ', ' + escapeHtml(order.shipping_postcode) : ''}<br>
                      ${order.customer_phone ? 'Tel: ' + escapeHtml(order.customer_phone) : ''}
                    </p>
                    <h4 style="margin-top:14px">Shipping Method</h4>
                    <p>${order.shipping_method === 'express' ? 'Express (3–5 days)' : 'Standard (10–12 days)'}</p>
                    <h4 style="margin-top:14px">Totals</h4>
                    <p>
                      Subtotal: &pound;${Number(order.subtotal || 0).toFixed(2)}<br>
                      Shipping: &pound;${Number(order.shipping_cost || 0).toFixed(2)}<br>
                      VAT: &pound;${Number(order.vat || 0).toFixed(2)}<br>
                      <strong>Total: &pound;${Number(order.total || 0).toFixed(2)}</strong>
                    </p>
                  </div>
                  <div class="detail-section">
                    <h4>Framing Specifications</h4>
                    ${items.map((i, idx) => {
                      const s = i.spec;
                      let html = '<div>' + (items.length > 1 ? '<strong>Item ' + (idx+1) + ': ' + escapeHtml(i.name || 'Frame') + ' &times;' + (i.qty||1) + '</strong>' : '');

                      if (s) {
                        html += '<div class="spec-grid">';
                        // Print
                        if (s.print) {
                          html += '<div class="spec-item"><div class="spec-label">Print</div><div class="spec-value">' + escapeHtml(s.print.type || '—') + '</div></div>';
                          html += '<div class="spec-item"><div class="spec-label">Size</div><div class="spec-value">' + escapeHtml(s.print.sizeLabel || '—') + (s.print.isCustomSize ? ' (Custom)' : '') + '</div>' +
                            (s.print.widthCm && s.print.heightCm ? '<div class="spec-sub">' + s.print.widthCm + ' &times; ' + s.print.heightCm + ' cm &bull; ' + escapeHtml(s.print.orientation || '') + '</div>' : '') + '</div>';
                        }
                        // Frame
                        if (s.frame) {
                          html += '<div class="spec-item"><div class="spec-label">Moulding</div><div class="spec-value">' + escapeHtml(s.frame.name) + '</div><div class="spec-sub">' + escapeHtml(s.frame.code) + '</div></div>';
                          html += '<div class="spec-item"><div class="spec-label">Frame Detail</div><div class="spec-value">' + s.frame.widthMm + 'mm ' + escapeHtml(s.frame.finish || '') + '</div><div class="spec-sub">' + escapeHtml(s.frame.profile || '') + ' profile</div></div>';
                        } else {
                          html += '<div class="spec-item"><div class="spec-label">Frame</div><div class="spec-value">No frame</div></div>';
                        }
                        // Mount
                        if (s.mount) {
                          html += '<div class="spec-item"><div class="spec-label">Mount</div><div class="spec-value">' + escapeHtml(s.mount.type) + '</div><div class="spec-sub">' + escapeHtml(s.mount.colour || '') + (s.mount.colourCode ? ' (' + escapeHtml(s.mount.colourCode) + ')' : '') + '</div></div>';
                          html += '<div class="spec-item"><div class="spec-label">Mount Width</div><div class="spec-value">' + (s.mount.widthMm || '—') + 'mm</div><div class="spec-sub">' + escapeHtml(s.mount.widthLabel || '') + '</div></div>';
                          if (s.mount.secondColour) {
                            html += '<div class="spec-item"><div class="spec-label">2nd Mount Colour</div><div class="spec-value">' + escapeHtml(s.mount.secondColour) + '</div>' + (s.mount.secondColourCode ? '<div class="spec-sub">' + escapeHtml(s.mount.secondColourCode) + '</div>' : '') + '</div>';
                          }
                          if (s.mount.vGrooveColour) {
                            html += '<div class="spec-item"><div class="spec-label">V-Groove</div><div class="spec-value">' + escapeHtml(s.mount.vGrooveColour) + '</div></div>';
                          }
                        } else {
                          html += '<div class="spec-item"><div class="spec-label">Mount</div><div class="spec-value">None</div></div>';
                        }
                        // Glass
                        html += '<div class="spec-item"><div class="spec-label">Glass</div><div class="spec-value">' + (s.glass ? escapeHtml(s.glass.type) : 'None') + '</div></div>';
                        // Pricing breakdown
                        if (s.pricing) {
                          html += '<div class="spec-item"><div class="spec-label">Price Breakdown</div><div class="spec-value">&pound;' + Number(i.price||0).toFixed(2) + '</div><div class="spec-sub">';
                          if (s.pricing.print) html += 'Print &pound;' + s.pricing.print.toFixed(2) + ' ';
                          if (s.pricing.frame) html += 'Frame &pound;' + s.pricing.frame.toFixed(2) + ' ';
                          if (s.pricing.mount) html += 'Mount &pound;' + s.pricing.mount.toFixed(2) + ' ';
                          if (s.pricing.glass) html += 'Glass &pound;' + s.pricing.glass.toFixed(2);
                          html += '</div></div>';
                        }
                        html += '</div>';
                        // Framed preview and customer image
                        if (s.previewImageUrl || s.rawImageUrl) {
                          html += '<div style="margin-top:12px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">';
                          if (s.previewImageUrl) {
                            html += '<div><div class="spec-label" style="margin-bottom:6px">Framed Preview</div>' +
                              '<a href="' + escapeHtml(s.previewImageUrl) + '" target="_blank">' +
                              '<img src="' + escapeHtml(s.previewImageUrl) + '" alt="Framed preview" style="max-width:220px;max-height:220px;border-radius:6px;border:1px solid #E8E4E0;cursor:pointer" />' +
                              '</a></div>';
                          }
                          if (s.rawImageUrl) {
                            html += '<div><div class="spec-label" style="margin-bottom:6px">Customer Image</div>' +
                              '<a href="' + escapeHtml(s.rawImageUrl) + '" target="_blank">' +
                              '<img src="' + escapeHtml(s.rawImageUrl) + '" alt="Customer image" style="max-width:220px;max-height:220px;border-radius:6px;border:1px solid #E8E4E0;cursor:pointer" />' +
                              '</a></div>';
                          }
                          html += '</div>';
                        }
                      } else {
                        html += '<p>' + escapeHtml(i.name || 'Frame') + ' — ' + escapeHtml(i.dims || '') + (i.mount ? ' + ' + escapeHtml(i.mount) + ' mount' : '') + ' &times;' + (i.qty||1) + ' &mdash; &pound;' + (Number(i.price||0)*(i.qty||1)).toFixed(2) + '</p>';
                      }

                      html += '</div>';
                      if (idx < items.length - 1) html += '<hr class="item-divider">';
                      return html;
                    }).join('')}
                  </div>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function toggleDetail(id) {
        const row = document.getElementById('detail-' + id);
        const btn = row.previousElementSibling.querySelector('.expand-btn');
        if (row.classList.contains('open')) {
          row.classList.remove('open');
          btn.textContent = '▶';
        } else {
          row.classList.add('open');
          btn.textContent = '▼';
        }
      }

      async function updateStatus(id, status) {
        if (!accessToken) return;
        try {
          const res = await fetch('/api/update-order', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + accessToken,
            },
            body: JSON.stringify({ id, status }),
          });
          if (res.status === 401) {
            await sb.auth.signOut();
            showScreen('login');
            return;
          }
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || 'Failed to update');
          }
        } catch (err) {
          alert('Failed to update order status: ' + err.message);
        }
        await fetchOrders();
      }

      async function archiveOrder(id) {
        if (!confirm('Archive this order? It will be hidden from the main view.')) return;
        await updateStatus(id, 'archived');
      }

      // Filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.status;
          renderOrders();
        });
      });

      // Boot
      init();
    </script>
  </body>
</html>
